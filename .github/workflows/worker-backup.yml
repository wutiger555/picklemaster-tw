name: Worker D1 nightly backup

# 這個 repo 是公開的：artifact 任何登入 GitHub 的人都能下載，
# 所以備份一定先用 BACKUP_PASSPHRASE 加密（AES-256 + PBKDF2），明文檔案不離開 runner。
# 還原：openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in backup.sql.enc -out backup.sql
on:
  schedule:
    - cron: '30 18 * * *' # 台灣 02:30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until Cloudflare is set up
        if: env.CLOUDFLARE_API_TOKEN == '' || env.BACKUP_PASSPHRASE == ''
        run: echo "::notice::Cloudflare 或備份金鑰尚未設定，略過備份"
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.BACKUP_PASSPHRASE != ''
        with: { node-version: '20', cache: 'npm', cache-dependency-path: worker/package-lock.json }
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.BACKUP_PASSPHRASE != ''
        run: npm ci
      - name: Export and encrypt
        if: env.CLOUDFLARE_API_TOKEN != '' && env.BACKUP_PASSPHRASE != ''
        run: |
          set -euo pipefail
          umask 077
          npx wrangler d1 export picklemaster-play --remote --output "$RUNNER_TEMP/backup.sql"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$RUNNER_TEMP/backup.sql" -out "$RUNNER_TEMP/backup.sql.enc" -pass env:BACKUP_PASSPHRASE
          shred -u "$RUNNER_TEMP/backup.sql" || rm -f "$RUNNER_TEMP/backup.sql"
          ls -l "$RUNNER_TEMP/backup.sql.enc"
      - uses: actions/upload-artifact@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.BACKUP_PASSPHRASE != ''
        with:
          name: d1-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backup.sql.enc
          retention-days: 30
          if-no-files-found: error
