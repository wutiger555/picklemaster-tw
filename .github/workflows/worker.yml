name: Worker (揪團約打 API)

# worker/ 或球場資料變動時：先跑測試，main 上才部署。
# 球場資料與固定球敘的解析規則會打包進 Worker（只能在站內球場開團、驗證「我會去」），
# 所以 courts.json 與 src/utils/fixedSessions.ts 變動也要重新部署。
on:
  push:
    branches: [main]
    paths: ['worker/**', 'public/data/courts.json', 'src/utils/fixedSessions.ts', 'src/utils/courtTags.ts', 'src/types/**', '.github/workflows/worker.yml']
  pull_request:
    paths: ['worker/**', 'public/data/courts.json', 'src/utils/fixedSessions.ts', 'src/utils/courtTags.ts', 'src/types/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: worker/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until Cloudflare is set up
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN 尚未設定，略過部署"
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with: { node-version: '22', cache: 'npm', cache-dependency-path: worker/package-lock.json }
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply picklemaster-play --remote
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
