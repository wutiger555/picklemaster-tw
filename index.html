  <!-- GitHub Pages SPA 路由恢復腳本 -->
  <script>
    // 檢查是否有從 404.html 重定向過來的路徑
    (function () {
      var redirect = sessionStorage.getItem('redirect');
      if (redirect) {
        sessionStorage.removeItem('redirect');
        history.replaceState(null, '', redirect);
      }
    })();
  </script>
  <div id="root"></div>

  <!-- Service Worker Registration for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('Service Worker registered:', registration);
          })
          .catch(error => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>

  <!-- Lazy Load Google AdSense -->
  <script>
    const loadAdSense = () => {
      const script = document.createElement('script');
      script.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7062108661079564";
      script.async = true;
      script.crossOrigin = "anonymous";
      document.head.appendChild(script);

      // Remove event listeners after loading the script
      ['scroll', 'mousemove', 'touchstart', 'click'].forEach(event =>
        window.removeEventListener(event, loadAdSense, { once: true })
      );
    };

    // Add event listeners to trigger AdSense loading on user interaction
    ['scroll', 'mousemove', 'touchstart', 'click'].forEach(event =>
      window.addEventListener(event, loadAdSense, { once: true, passive: true })
    );
  </script>
